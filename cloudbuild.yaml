# Cloud Build configuration for Cloud Run deployment
# Used by GCP's built-in continuous deployment from GitHub.
#
# Steps:
#   1. Build Docker image from root Dockerfile
#   2. Push to Artifact Registry
#   3. Deploy to Cloud Run with secrets from Secret Manager

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # Push to Artifact Registry (explicit — images section alone may not resolve vars)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_ARTIFACT_REGISTRY}/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:${_TAG}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_ARTIFACT_REGISTRY}/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '3000'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,AWS_REGION=ap-southeast-3,DB_HOST=${_DB_HOST},DB_PORT=5432,DB_NAME=bedrock_gateway,DB_USER=${_DB_USER},DB_SSL=true,GOTENBERG_URL=${_GOTENBERG_URL},TIER3_ENABLED=true,TIER3_BASE_URL=${_TIER3_BASE_URL}'
      - '--set-secrets'
      - 'DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest,AWS_ACCESS_KEY_ID=aws-access-key-id:latest,AWS_SECRET_ACCESS_KEY=aws-secret-access-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest,TIER3_API_KEY=tier3-api-key:latest'

substitutions:
  _REGION: asia-southeast2
  _SERVICE_NAME: beexexity
  _ARTIFACT_REGISTRY: asia-southeast2-docker.pkg.dev
  _TAG: latest
  # DB defaults baked here so ANY rebuild (trigger vars empty/cleared) still reaches the
  # shared Cloud SQL instance — an empty DB_HOST previously fell back to 'localhost' and
  # prod threw ECONNREFUSED 127.0.0.1:5432. Override per environment in the trigger if needed.
  _DB_HOST: '34.101.75.59'     # Cloud SQL public IP
  _DB_USER: 'postgres'
  _GOTENBERG_URL: ''      # set after Gotenberg deploy → Variables
  _TIER3_BASE_URL: 'https://api.deepseek.com'   # external OpenAI-compatible gateway (DeepSeek)

images:
  - '${_ARTIFACT_REGISTRY}/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:${_TAG}'
  - '${_ARTIFACT_REGISTRY}/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
